name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.24.9', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 ./...

      # The v2 module lives in the v2/ major-version subdirectory; gofmt
      # above already covers it, but vet/build/test need the module flag.
      # excel/parquet/sql are nested modules of v2.
      - name: go vet (v2)
        run: |
          go vet -C v2 ./...
          go vet -C v2/excel ./...
          go vet -C v2/parquet ./...
          go vet -C v2/sql ./...

      - name: build (v2)
        run: |
          go build -C v2 ./...
          go build -C v2/excel ./...
          go build -C v2/parquet ./...
          go build -C v2/sql ./...

      - name: test (v2)
        run: |
          go test -C v2 -count=1 ./...
          go test -C v2/excel -count=1 ./...
          go test -C v2/parquet -count=1 ./...
          go test -C v2/sql -count=1 ./...

  race:
    name: race detector (ubuntu, CGO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: go test -race
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...

      - name: go test -race (v2)
        env:
          CGO_ENABLED: 1
        run: |
          go test -C v2 -race -count=1 ./...
          go test -C v2/excel -race -count=1 ./...
          go test -C v2/parquet -race -count=1 ./...
          go test -C v2/sql -race -count=1 ./...

  fuzz:
    name: fuzz smoke (${{ matrix.line }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzQuery }
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzReadCSVDetectDelimiter }
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzParquetRoundTrip }
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzInnerJoinCount }
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzInnerJoinCompositeCount }
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzLeftJoinCount }
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzIndexLoc }
          - { line: v1, dir: ., pkg: ./dataframe, target: FuzzMultiIndexLoc }
          - { line: v1, dir: ., pkg: ./series, target: FuzzBatchConvertStrings }
          - { line: v2, dir: v2, pkg: ./dataframe, target: FuzzQuery }
          - { line: v2, dir: v2, pkg: ./dataframe, target: FuzzReadCSVDetectDelimiter }
          - { line: v2, dir: v2/parquet, pkg: ., target: FuzzParquetRoundTrip }
          - { line: v2, dir: v2, pkg: ./dataframe, target: FuzzInnerJoinCount }
          - { line: v2, dir: v2, pkg: ./dataframe, target: FuzzInnerJoinCompositeCount }
          - { line: v2, dir: v2, pkg: ./dataframe, target: FuzzLeftJoinCount }
          - { line: v2, dir: v2, pkg: ./dataframe, target: FuzzIndexLoc }
          - { line: v2, dir: v2, pkg: ./dataframe, target: FuzzMultiIndexLoc }
          - { line: v2, dir: v2, pkg: ./series, target: FuzzBatchConvertStrings }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Short bounded run: exercises seed corpus plus randomized mutations.
      # Crashers are written to testdata/fuzz and fail the build.
      # The coordinator occasionally reports "context deadline exceeded"
      # instead of stopping cleanly when the budget expires on a busy
      # runner; retry once. Real crashers fail both runs.
      - name: fuzz ${{ matrix.target }}
        run: |
          if ! go test -C ${{ matrix.dir }} -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=60s ${{ matrix.pkg }}; then
            echo "::warning::retrying ${{ matrix.target }} after fuzz shutdown flake"
            go test -C ${{ matrix.dir }} -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=60s ${{ matrix.pkg }}
          fi

  docs:
    name: documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Anchor-link consistency for README and ROADMAP (internal/doccheck
      # also runs inside the test matrix).
      - name: doc anchors
        run: go test -v ./internal/doccheck/

      - name: doc anchors (v2)
        run: go test -C v2 -v ./internal/doccheck/

  release-checklist:
    name: release checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The most recent tag of each major line must have a dated CHANGELOG
      # heading before a release is considered complete. v1.x tags are
      # checked against the root CHANGELOG.md; v2+ tags belong to the module
      # in the v2/ subdirectory (plain v2.x.y tags, gax-go layout) and are
      # checked against v2/CHANGELOG.md.
      - name: latest tags have CHANGELOG entries
        shell: bash
        run: |
          check_tag() {
            tag="$1"; file="$2"; ver="${tag#v}"
            echo "checking tag $tag against $file"
            if ! grep -qE "^## \[$ver\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" "$file"; then
              echo "$tag has no dated '## [$ver] - YYYY-MM-DD' heading in $file" >&2
              exit 1
            fi
          }
          latest_v1=$(git tag -l 'v*' | grep -E '^v1[0-9]*\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$latest_v1" ]; then
            echo "no v1 version tags found" >&2
            exit 1
          fi
          check_tag "$latest_v1" CHANGELOG.md
          latest_v2=$(git tag -l 'v*' | grep -E '^v[2-9][0-9]*\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$latest_v2" ]; then
            check_tag "$latest_v2" v2/CHANGELOG.md
          else
            echo "no v2+ version tags yet; skipping"
          fi

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: restore master baseline
        uses: actions/cache@v4
        with:
          path: bench-baseline.txt
          key: gota-bench-master-${{ github.sha }}
          restore-keys: gota-bench-master-

      - name: run benchmarks
        run: |
          go test -run='^$' -bench=. -benchmem -count=6 ./... | tee bench-current.txt
          go test -C v2 -run='^$' -bench=. -benchmem -count=6 ./... | tee bench-current-v2.txt
          cat bench-current-v2.txt >> bench-current.txt

      # Informational only: runner hardware varies, so regressions are
      # reported in the job log rather than failing the build.
      - name: compare against baseline
        if: hashFiles('bench-baseline.txt') != ''
        run: benchstat bench-baseline.txt bench-current.txt

      - name: upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench-current.txt

      - name: update master baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: cp bench-current.txt bench-baseline.txt

      - name: save master baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: bench-baseline.txt
          key: gota-bench-master-${{ github.sha }}
